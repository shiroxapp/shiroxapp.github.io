<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#fafaf9" />
		<!--
			Runs before the first paint, so a visitor never sees a flash of the wrong
			theme. An explicit prior choice wins; absent one, the OS preference
			decides. Deliberately not module/deferred. Kept in sync with
			src/lib/theme.svelte.ts.
		-->
		<script>
			var stored, dark;
			try {
				stored = localStorage.getItem('shirox-theme');
				dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				if (dark) {
					document.documentElement.dataset.theme = 'dark';
					document.querySelector('meta[name="theme-color"]').content = '#0b0b0c';
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
