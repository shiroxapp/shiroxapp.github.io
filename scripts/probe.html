<!doctype html>
<html lang="en">
<body style="margin:0">
<script>
const checks = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function check(name, actual, expected) {
	const pass = typeof expected === 'function' ? expected(actual) : String(actual) === String(expected);
	checks.push({ name, actual: String(actual), pass });
}

/** Loads the built page in an iframe of the given size and resolves once hydrated. */
function load(src, width = 1100, height = 800) {
	return new Promise((resolve) => {
		const frame = document.createElement('iframe');
		frame.style.cssText = `width:${width}px;height:${height}px;border:0`;
		frame.src = src;
		frame.onload = async () => {
			for (let i = 0; i < 100 && !frame.contentWindow.__hydrated; i++) await sleep(50);
			resolve({ doc: frame.contentDocument, win: frame.contentWindow });
		};
		document.body.append(frame);
	});
}

/** Visibility that tolerates the element not existing yet, so a missing selector
    fails its own check instead of throwing the run away.

    Asks the cascade rather than reading `offsetParent`, which is null for any
    `position: fixed` element whether it is displayed or not — the hairline is fixed,
    so offsetParent would call it hidden at every width. */
const shown = (frame, selector) => {
	const el = frame.doc.querySelector(selector);
	return el ? frame.win.getComputedStyle(el).display !== 'none' : 'missing';
};

async function run() {
	const { doc, win } = await load('/index.html');

	/* One entrance mechanism, so there is one thing to assert: the observer hides
	   what is still below the fold and the CSS transitions it in. The scroll-linked
	   `view()` path these checks used to cover was removed — it ran on only some of
	   this site's browsers, so the entrance was a different gesture depending on who
	   was looking. */
	check('nothing scroll-linked survives', getComputedStyle(doc.querySelector('#features .glow-field > article')).animationName, 'none');
	check('the observer hides what is below the fold', doc.querySelectorAll('.rise').length, (v) => Number(v) > 0);

	// Regression guard for the hydration flash fixed on 2026-07-26: the observer must
	// leave anything already painted on the first screen alone, rather than hiding it
	// and fading it back in.
	const firstScreen = [...doc.querySelectorAll('.rise')].filter((el) => {
		const r = el.getBoundingClientRect();
		return r.top < win.innerHeight && r.bottom > 0;
	});
	check('nothing already on screen is hidden at load', firstScreen.length, '0');

	const cards = doc.querySelectorAll('#features .glow-field > article');
	// The hover response must still compose with the entrance rather than replace it,
	// and the entrance's own properties have to survive the component's scoped list.
	check('card hover still transitions translate', getComputedStyle(cards[0]).transitionProperty,
		(v) => v.includes('translate') && v.includes('scale'));
	check('card still transitions the entrance', getComputedStyle(cards[0]).transitionProperty,
		(v) => v.includes('opacity') && v.includes('transform'));
	check('heading words are staggered apart', doc.querySelectorAll('#features-heading span').length, (v) => Number(v) > 1);

	/* The device is on the first screen at every viewport, so its entrance is a load
	   animation, not a scroll one. Asserting the animation rather than a class is
	   deliberate: an element already past the observer's trigger line gains `in` in the
	   same frame as `rise` and paints neither state, so a class check would pass while
	   nothing whatsoever moved. */
	check('the device arrives with a load animation', getComputedStyle(doc.querySelector('.device')).animationName, 'rise-in');
	check('the device is not scroll-armed as well', doc.querySelector('.device').classList.contains('rise'), 'false');

	check('idle drift survives on its own element', getComputedStyle(doc.querySelector('.float')).animationName, 'float');
	check('drift and entrance are not the same element', doc.querySelectorAll('.device.float').length, '0');

	const narrow = await load('/index.html', 390, 844);
	const bar = narrow.doc.querySelector('header > div');
	const barStyle = narrow.win.getComputedStyle(bar);
	const barBox = bar.getBoundingClientRect();

	check('dock spans the viewport below sm', Math.round(barBox.width), '390');
	check('dock sits flush to the top', Math.round(barBox.top), (v) => Number(v) < 4);
	check('dock has no pill radius below sm', barStyle.borderTopLeftRadius, '0px');
	check('dock clears the status bar', barStyle.paddingTop, (v) => parseFloat(v) >= 8);
	check('dividers are gone below sm', [...bar.querySelectorAll(':scope > span[aria-hidden]')].filter((s) => s.offsetParent !== null).length, '0');
	check('progress hairline hidden below sm', shown(narrow, '.progress'), 'false');

	const wide = await load('/index.html', 1100, 800);
	const pill = wide.doc.querySelector('header > div');
	check('desktop dock is still a pill', wide.win.getComputedStyle(pill).borderTopLeftRadius, (v) => parseFloat(v) > 10);
	check('desktop dock is not full width', Math.round(pill.getBoundingClientRect().width), (v) => Number(v) < 1000);
	check('progress hairline returns at sm and up', shown(wide, '.progress'), 'true');

	await report();
}

function report() {
	return fetch('/__report', {
		method: 'POST',
		headers: { 'content-type': 'application/json' },
		body: JSON.stringify(checks)
	});
}

/* A check that throws must not take the run with it: an unreported probe looks
   identical to a hung browser, and says nothing about which check broke. */
run().catch((error) => {
	check(`probe threw: ${error?.message}`, error?.stack, () => false);
	report();
});
</script>
</body>
</html>
